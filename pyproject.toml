[build-system]
# >=77 才支持 PEP 639 的 license = "MIT" 写法；它自带 wheel 构建，无需单列 wheel。
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-ai"
# 版本号只有 quant_agent/__init__.py 一处。发版 workflow 拿 tag 和它核对，
# 避免 tag、pyproject、__version__ 三处不一致导致发错版本（PyPI 不可重发）。
dynamic = ["version"]
description = "面向普通股民的美股量化研究与回测工具：一行命令分析个股，给出可解释的评级与关键价位。"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tyndall Labs" }]
keywords = ["quant", "stocks", "us-equities", "backtest", "technical-analysis", "yfinance"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "yfinance>=0.2.40",
    "PyYAML>=6.0",
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "matplotlib>=3.8",
    "scikit-learn>=1.4",
    # 上界不能去掉：mcp 2.0 把 FastMCP 重命名为 MCPServer、模块从 mcp.server.fastmcp
    # 挪到 mcp.server.mcpserver，无上界时 CI 会装 2.x 而 mcp_server.py 直接 ImportError。
    # 迁移到 2.x 是独立的一次改造（还要同步升级用户本地长驻的 MCP server）。
    "mcp>=1.20,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/TingdeLiu/quant.ai"
Repository = "https://github.com/TingdeLiu/quant.ai"
Issues = "https://github.com/TingdeLiu/quant.ai/issues"

[project.scripts]
quant-ai = "quant_agent.cli:app"

[tool.setuptools]
# configs/ 以 quant_agent.templates 的名字随 wheel 分发：仓库里只有一份源文件，
# 安装后由 quant_agent.paths 播种到 ~/.quant-ai/configs/。
packages = ["quant_agent", "quant_agent.templates"]

[tool.setuptools.dynamic]
version = { attr = "quant_agent.__version__" }

[tool.setuptools.package-dir]
"quant_agent.templates" = "configs"

[tool.setuptools.package-data]
"quant_agent.templates" = ["*.yaml", "*.csv"]

[tool.setuptools.exclude-package-data]
# 个人文件绝不能进安装包：这几个是本地 gitignore 的自选股与偏好，
# 按 *.yaml / *.csv 的 glob 会被误收，必须显式排除。
"quant_agent.templates" = ["my.yaml", "my_universe.csv", "profile.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# E/F: pyflakes+pycodestyle, I: isort, UP: pyupgrade, B: bugbear, SIM: simplify
select = ["E", "F", "I", "UP", "B", "SIM"]
# E501 行宽交给 formatter；B008 与 typer 的 Argument/Option 默认值用法冲突。
ignore = ["E501", "B008"]
